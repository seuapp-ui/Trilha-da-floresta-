<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Trilha da Floresta — Plataforma 2.5D</title>
  <meta name="description" content="Jogo de plataforma lateral 2.5D inspirado em clássicos do gênero, com física suave, parallax em múltiplas camadas e mecânicas modernas." />

  <!-- Modular ES6 game code. index.js only imports main.js; every other
       module is pulled in transitively via ES module imports, so adding
       new files never requires touching this HTML. -->
  <script type="module" src="src/main.js"></script>
